<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iintoo - Registration</title>
  
  <!-- Barlow Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card-container">
    
    <!-- Left Hero/Banner Section -->
    <section class="hero-section">
      <div class="logo">
        <img src="img/logo.svg" alt="iintoo logo">
      </div>
      
      <div class="hero-content">
        
      </div>
    </section>

    <!-- Right Form Section -->
    <section class="form-section">
      <div class="form-header">
        <h3>Get iintoo it today</h3>
        <p>There is no charge or obligation upon registration.</p>
      </div>

      <!-- Social Registration Buttons -->
      <div class="social-buttons">
        <button type="button" class="btn btn-facebook">
          <img src="img/facebook.svg" alt="Facebook logo">
          <span>Register with Facebook</span>
        </button>
        <button type="button" class="btn btn-linkedin">
          <img src="img/linkedin.svg" alt="LinkedIn logo">
          <span>Register with LinkedIn</span>
        </button>
      </div>

      <div class="divider">
        <span>or</span>
      </div>

      <!-- Registration Form -->
      <form action="#" method="POST">
        <div class="input-group">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="gus.goodwin@gmail.com" required>
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" required>
          </div>
        </div>

        <div class="investor-type-section">
          <h3>What type of investor are you?</h3>
          <p class="subtitle">Select the type of investor you are below.</p>

          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="investor_type" value="individual" checked>
              <span>Individual</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="investor_type" value="business">
              <span>Business</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="investor_type" value="ira">
              <span>IRA</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="investor_type" value="trust">
              <span>Trust</span>
            </label>
          </div>

          <div class="investor-description">
            <p>I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.</p>
          </div>
        </div>

        <div class="terms-option">
          <label>
            <input type="checkbox" name="terms" required>
            I agree to the terms and receiving notifications from iintoo <a href="#">View full terms</a>
          </label>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>
    </section>

  </main>

</body>
</html>
